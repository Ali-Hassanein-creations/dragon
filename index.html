<meta charset="utf-8">
<title>Dragon Over the Siege</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Marcellus+SC&display=swap">
<style>
  /* Single dark look: a fullscreen WebGL scene with a vertical calligraphy plate, a seal and a shot selector. */
  :root { --bg:#07030a; --gold:#ffd27a; --ink:#fff1e0; --seal:#b3121b; --cap:rgba(255,230,200,.72); --chip:rgba(20,6,10,.55); color-scheme:dark }
  html, body { height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--ink) }
  canvas { display:block; width:100%; height:100%; cursor:crosshair }
  .plate { position:fixed; top:calc(20px + env(safe-area-inset-top,0px)); right:max(20px, env(safe-area-inset-right,0px));
    display:flex; gap:10px; align-items:flex-start; pointer-events:none }
  .zh { writing-mode:vertical-rl; font-family:"Ma Shan Zheng","STKaiti","KaiTi",serif; font-size:clamp(36px,5.5vw,66px);
    line-height:1; letter-spacing:.08em; color:var(--gold); text-shadow:0 0 18px rgba(255,120,30,.75), 0 0 2px #000 }
  .seal { writing-mode:vertical-rl; font-family:"Ma Shan Zheng","STKaiti","KaiTi",serif; font-size:clamp(14px,1.6vw,19px);
    color:var(--ink); background:var(--seal); padding:7px 4px; border-radius:3px; box-shadow:0 0 14px rgba(200,20,30,.6) }
  .bar { position:fixed; left:max(16px, env(safe-area-inset-left,0px)); right:max(16px, env(safe-area-inset-right,0px));
    bottom:calc(16px + env(safe-area-inset-bottom,0px)); display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; pointer-events:none }
  .cap { font:13px/1.5 "Marcellus SC",Georgia,serif; letter-spacing:.12em; color:var(--cap); text-shadow:0 1px 3px #000; min-width:0 }
  .shots { display:flex; gap:6px; pointer-events:auto }
  .shots button { font:12px/1 "Marcellus SC",Georgia,serif; letter-spacing:.12em; color:var(--gold); background:var(--chip);
    border:1px solid rgba(255,210,122,.35); border-radius:999px; padding:8px 13px; cursor:pointer; backdrop-filter:blur(6px) }
  .shots button[aria-pressed="true"] { background:var(--seal); color:var(--ink); border-color:transparent }
  .shots button:focus-visible { outline:2px solid var(--gold); outline-offset:2px }
  .loader { position:fixed; inset:0; display:grid; place-items:center; font:15px "Marcellus SC",Georgia,serif; letter-spacing:.3em;
    color:var(--gold); background:var(--bg); transition:opacity .8s }
</style>

<div class="plate" aria-hidden="true"><div class="zh">龍戰于野</div><div class="seal">其血玄黃</div></div>
<div class="bar">
  <div class="cap">Dragons battle in the wild · I Ching, hexagram 2 &nbsp;·&nbsp; Click to breathe fire</div>
  <div class="shots" role="group" aria-label="Camera shot">
    <button id="shot-auto" data-shot="auto" aria-pressed="true">Director</button>
    <button id="shot-wide" data-shot="wide" aria-pressed="false">Wide</button>
    <button id="shot-follow" data-shot="follow" aria-pressed="false">Follow</button>
    <button id="shot-close" data-shot="close" aria-pressed="false">Close-up</button>
  </div>
</div>
<div class="loader" id="loader">Forging the dragon</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/objects/MarchingCubes.js"></script>
<script>
// let the loader paint before the heavy sculpting work
requestAnimationFrame(() => setTimeout(main, 30));

function main() {
const { Vector3: V3, Color, Group, Mesh } = THREE;
THREE.ColorManagement.legacyMode = false;
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const Y_AXIS = new V3(0, 1, 0);

// ---------- renderer / camera ----------
let PR = Math.min(devicePixelRatio, 2);
const renderer = new THREE.WebGLRenderer({ powerPreference: 'high-performance' });
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.domElement.setAttribute('aria-label', 'A metallic Chinese dragon flying a figure-eight over a besieged fortress');
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x7a2440, 0.0016);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.3, 4000);
const SUN = new V3(-0.35, 0.07, -1).normalize();
const U = { time: { value: 0 }, pixel: { value: 1 } };
const setPixel = () => U.pixel.value = (innerHeight * PR * 0.5) / Math.tan(camera.fov * Math.PI / 360);
setPixel();

// ---------- sky ----------
const skyVS = `varying vec3 vDir; void main(){ vec4 w = modelMatrix*vec4(position,1.); vDir = w.xyz - cameraPosition; gl_Position = projectionMatrix*viewMatrix*w; }`;
const skyFS = `
uniform float uTime; uniform vec3 uSun; varying vec3 vDir;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<6;i++){ v+=a*noise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return v; }
void main(){
  vec3 d = normalize(vDir); float h = d.y; float s = max(dot(d,uSun),0.);
  vec3 col = mix(vec3(2.4,.55,.1), vec3(.45,.03,.4), smoothstep(-.02,.22,h));
  col = mix(col, vec3(.02,.008,.08), smoothstep(.2,.75,h));
  col += vec3(2.6,.9,.25)*pow(s,6.)*(1.-smoothstep(0.,.5,h));
  col += vec3(1.8,.5,.7)*pow(s,40.);
  vec2 uv = d.xz/(abs(h)+.12);
  float n = fbm(uv*.55 + vec2(uTime*.006, uTime*.002));
  float n2 = fbm(uv*1.6 - vec2(uTime*.012, 0.));
  float c = smoothstep(.42,.8, n*.75 + n2*.35);
  float lit = clamp(pow(s,2.5)*1.6 + (1.-smoothstep(0.,.35,h))*.9, 0., 1.);
  vec3 cloud = mix(vec3(.07,.01,.08), vec3(2.8,.75,.28), lit) + vec3(1.,.12,.6)*smoothstep(.55,.9,n2)*lit;
  col = mix(col, cloud, c*smoothstep(-.03,.06,h)*.9);
  col += vec3(7.,3.4,1.3)*smoothstep(.9993,.9996,dot(d,uSun));
  vec2 sp = floor(d.xz/(h+1.)*420.);
  col += vec3(1.6)*step(.9985,hash(sp))*smoothstep(.35,.8,h)*(1.-c)*(.5+.5*sin(uTime*3.+hash(sp)*40.));
  col = mix(col, vec3(.06,.015,.04), smoothstep(0.,-.12,h));
  gl_FragColor = vec4(col,1.);
}`;
const skyMat = new THREE.ShaderMaterial({ vertexShader: skyVS, fragmentShader: skyFS, side: THREE.BackSide, depthWrite: false,
  uniforms: { uTime: U.time, uSun: { value: SUN } } });
const sky = new Mesh(new THREE.SphereGeometry(1500, 64, 32), skyMat);
sky.renderOrder = -10;
scene.add(sky);

// ---------- environment map: the sky plus hot fire panels and cyan/magenta cards, so metal reflects pure color ----------
{
  const env = new THREE.Scene();
  const m = skyMat.clone(); m.uniforms = { uTime: { value: 40 }, uSun: { value: SUN } };
  env.add(new Mesh(new THREE.SphereGeometry(100, 64, 32), m));
  const panel = (c, x, y, z, w, h) => { const p = new Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); p.position.set(x, y, z); p.lookAt(0, 0, 0); env.add(p); };
  panel(new Color(7, 1.8, .3), -30, -12, -60, 70, 14);
  panel(new Color(5, 1.2, .15), 45, -16, -50, 40, 10);
  panel(new Color(.15, 2.6, 4.5), -70, 18, 30, 30, 42);
  panel(new Color(3.5, .2, 2.8), 70, 28, 20, 30, 42);
  panel(new Color(3.2, 2.6, 2.1), 20, 80, 40, 60, 20);
  panel(new Color(1.6, 1.4, 1.2), -10, 40, 90, 50, 30);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, 0.03).texture;
}

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0x6a3a9a, 0x401008, 0.5));
const rim = new THREE.DirectionalLight(0xff8a3a, 2.6); rim.position.copy(SUN).multiplyScalar(100); scene.add(rim);
const key = new THREE.DirectionalLight(0xffe0c0, 2.0); key.position.set(35, 55, 60); key.target.position.set(0, 5, 0);
key.castShadow = true; key.shadow.mapSize.set(4096, 4096);
Object.assign(key.shadow.camera, { left: -50, right: 50, top: 42, bottom: -42, near: 1, far: 220 });
key.shadow.bias = -0.0003; key.shadow.normalBias = 0.03;
scene.add(key, key.target);
const fill = new THREE.DirectionalLight(0x30d0ff, 1.0); fill.position.set(-80, -20, 40); scene.add(fill);

// ---------- helpers ----------
const M = {
  stone: new THREE.MeshStandardMaterial({ color: 0x3b2a2c, roughness: .95, envMapIntensity: .3 }),
  red: new THREE.MeshStandardMaterial({ color: 0x9a1414, roughness: .6, envMapIntensity: .4 }),
  roof: new THREE.MeshStandardMaterial({ color: 0x0f4a44, roughness: .3, metalness: .6, side: THREE.DoubleSide }),
  gold: new THREE.MeshStandardMaterial({ color: 0xffb52e, roughness: .18, metalness: 1, envMapIntensity: 1.6 }),
  wood: new THREE.MeshStandardMaterial({ color: 0x4a2814, roughness: .9, envMapIntensity: .3 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x140c0e, roughness: 1, envMapIntensity: .2 }),
  glow: new THREE.MeshBasicMaterial({ color: new Color(4, 1.3, .25) }),
  gate: new THREE.MeshBasicMaterial({ color: new Color(1.6, .35, .05) }),
  lantern: new THREE.MeshBasicMaterial({ color: new Color(5, .6, .2) }),
};
function box(w, h, d, mat, x, y, z, parent = scene) { const m = new Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); parent.add(m); return m; }
function limb(a, b, r1, r2, mat) {
  const dir = new V3().subVectors(b, a), len = dir.length();
  const m = new Mesh(new THREE.CylinderGeometry(r2, r1, len, 10), mat);
  m.position.addVectors(a, b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(Y_AXIS, dir.normalize());
  return m;
}
function cone(base, dir, r, len, mat) {
  const g = new THREE.ConeGeometry(r, len, 8); g.translate(0, len / 2, 0);
  const m = new Mesh(g, mat); m.position.copy(base); m.quaternion.setFromUnitVectors(Y_AXIS, dir.clone().normalize());
  return m;
}
const hash1 = i => { const v = Math.sin(i * 127.1) * 43758.5453; return v - Math.floor(v); };
const vnoise = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash1(i), hash1(i + 1), u); };

// ---------- mountains ----------
[[-900, 230, -10, 0x8a3a72, 3], [-650, 160, -20, 0x4c1a4a, 11], [-420, 95, -24, 0x26091f, 23]].forEach(([z, ht, base, c, seed]) => {
  const s = new THREE.Shape(), X = 1500; s.moveTo(-X, -80);
  for (let i = 0; i <= 300; i++) {
    const x = -X + i * (2 * X / 300);
    let n = 0, a = 1, f = .003;
    for (let o = 0; o < 4; o++) { n += a * (1 - Math.abs(2 * vnoise(x * f + seed + o * 7) - 1)); a *= .5; f *= 2.1; }
    s.lineTo(x, base + n * ht * .55);
  }
  s.lineTo(X, -80);
  const m = new Mesh(new THREE.ShapeGeometry(s), new THREE.MeshBasicMaterial({ color: c }));
  m.position.z = z; scene.add(m);
});

// ---------- ground ----------
const ground = new Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshStandardMaterial({ color: 0x1d0f0c, roughness: 1, envMapIntensity: .25 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -22; scene.add(ground);

// ---------- fortress ----------
const ROOF = (() => {
  // square hip roof with the concave Chinese profile and upturned corners
  const g = new THREE.ConeGeometry(1, 1, 32, 8, true), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const t = .5 - y, phi = Math.atan2(z, x), sq = 1 / Math.max(Math.abs(Math.cos(phi)), Math.abs(Math.sin(phi)));
    p.setXYZ(i, Math.cos(phi) * t * sq, (1 - t) * (1 - t) + (sq - 1) * .9 * t * t * t, Math.sin(phi) * t * sq);
  }
  g.computeVertexNormals(); return g;
})();
function pagoda(x, y, z, w, d, tiers) {
  for (let k = 0; k < tiers; k++) {
    const bh = k === 0 ? 5 : 3.6;
    box(w, bh, d, M.red, x, y + bh / 2, z);
    box(w * .8, bh * .35, .2, M.glow, x, y + bh * .55, z + d / 2 + .05);
    y += bh;
    const r = new Mesh(ROOF, M.roof); r.scale.set(w / 2 + 2.2, 2.6 + k * .2, d / 2 + 2.2); r.position.set(x, y - .4, z); scene.add(r);
    for (const sx of [-1, 1]) { const l = new Mesh(new THREE.SphereGeometry(.45, 10, 8), M.lantern); l.position.set(x + sx * (w / 2 + 1.6), y - .9, z + d / 2 + 1.6); scene.add(l); }
    y += 1.4; w *= .74; d *= .74;
  }
  const f = new Mesh(new THREE.SphereGeometry(.7, 16, 12), M.gold); f.position.set(x, y + 1, z); scene.add(f);
  scene.add(cone(new V3(x, y + 1.4, z), Y_AXIS, .3, 2.4, M.gold));
  return y;
}
box(560, 20, 10, M.stone, 0, -12, -95);
{
  const n = 175, cren = new THREE.InstancedMesh(new THREE.BoxGeometry(1.6, 1.6, 1), M.stone, n), mm = new THREE.Matrix4();
  for (let i = 0; i < n; i++) { mm.makeTranslation(-278 + i * 3.2, -1.2, -90.4); cren.setMatrixAt(i, mm); }
  scene.add(cren);
  const ln = 64, lan = new THREE.InstancedMesh(new THREE.SphereGeometry(.5, 8, 6), M.lantern, ln);
  for (let i = 0; i < ln; i++) { mm.makeTranslation(-256 + i * 8 + 4, -3.5, -89.3); lan.setMatrixAt(i, mm); }
  scene.add(lan);
}
box(12, 12, .6, M.gate, 0, -16, -89.8);
box(14, 1.2, 1, M.gold, 0, -9.4, -89.6);
for (const x of [-240, -160, -80, 80, 160, 240]) box(14, 25, 15, M.stone, x, -9.5, -93);
box(38, 3, 15, M.stone, 0, -.5, -95);
pagoda(0, 1, -95, 30, 11, 3);
for (const x of [-80, 80]) pagoda(x, 3, -93, 15, 10, 2);
for (const x of [-160, 160]) pagoda(x, 3, -93, 12, 9, 1);
for (let k = 0; k < 46; k++) {
  const x = rand(-260, 260), z = rand(-112, -230), w = rand(6, 14), h = rand(4, 9);
  box(w, h, w * .8, Math.random() < .5 ? M.red : M.dark, x, -22 + h / 2, z);
  box(w * .5, 1, .2, M.glow, x, -22 + h * .6, z + w * .4 + .1);
  const r = new Mesh(ROOF, M.roof); r.scale.set(w / 2 + 1.5, 2.2, w * .4 + 1.5); r.position.set(x, -22 + h - .3, z); scene.add(r);
}
pagoda(-60, -22, -150, 14, 11, 4);
const palaceTop = pagoda(110, -22, -175, 13, 11, 5);

// ---------- siege towers and ladders ----------
function siegeTower(x, z, h) {
  const g = new Group(); g.position.set(x, -22, z); scene.add(g);
  box(7, h, 7, M.wood, 0, h / 2, 0, g);
  for (let y = 4; y < h; y += 4) box(7.3, .35, 7.3, M.dark, 0, y, 0, g);
  box(7.6, 1.2, 7.6, M.dark, 0, h + .6, 0, g);
  const ramp = box(5, .3, 6, M.wood, 0, h - 1.4, -5.2, g); ramp.rotation.x = -.45;
  for (const sx of [-3.6, 3.6]) for (const sz of [-2.5, 2.5]) { const w = new Mesh(new THREE.CylinderGeometry(1.3, 1.3, .6, 16), M.dark); w.rotation.z = Math.PI / 2; w.position.set(sx, 1.3, sz); g.add(w); }
}
[[-45, -81, 26], [38, -81, 25], [120, -82, 27], [-132, -82, 24]].forEach(a => siegeTower(...a));
for (let k = 0; k < 18; k++) {
  const x = rand(-230, 230); if (Math.abs(x) < 14) continue;
  for (const sx of [-.5, .5]) scene.add(limb(new V3(x + sx, -22, -82), new V3(x + sx, -2, -89.6), .1, .1, M.wood));
}

// ---------- the army ----------
{
  const pts = [], banners = [];
  for (let b = 0; b < 24; b++) {
    const cx = rand(-175, 175), cz = rand(-50, -76), rows = 6 + (Math.random() * 6 | 0), cols = 10 + (Math.random() * 10 | 0);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) pts.push([cx + (c - cols / 2) * 1.7 + rand(-.2, .2), cz + (r - rows / 2) * 1.7 + rand(-.2, .2)]);
    banners.push([cx - cols * .4, cz - rows * .9, 0], [cx + cols * .4, cz - rows * .9, 1]);
  }
  for (let k = 0; k < 900; k++) pts.push([rand(-230, 230), rand(-82, -88)]);
  for (let k = 0; k < 500; k++) pts.push([rand(-200, 200), rand(-18, -45)]);
  for (let k = 0; k < 34; k++) banners.push([-250 + k * 15 + 3, -89.2, 2 + (k % 2)]);

  const n = pts.length, mm = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), one = new V3(1, 1, 1);
  const men = new THREE.InstancedMesh(new THREE.CapsuleGeometry(.35, 1.1, 2, 6), new THREE.MeshStandardMaterial({ color: 0x2a1d1d, roughness: .5, metalness: .6 }), n);
  const spears = new THREE.InstancedMesh(new THREE.BoxGeometry(.06, 3.2, .06), new THREE.MeshStandardMaterial({ color: 0xbfb0a0, roughness: .3, metalness: 1 }), n);
  pts.forEach(([x, z], i) => {
    mm.makeTranslation(x, -22 + .9, z); men.setMatrixAt(i, mm);
    q.setFromEuler(e.set(rand(-.15, .15), 0, rand(-.15, .15)));
    mm.compose(new V3(x + .35, -22 + 1.7, z), q, one); spears.setMatrixAt(i, mm);
  });
  scene.add(men, spears);

  const nb = banners.length;
  const poles = new THREE.InstancedMesh(new THREE.CylinderGeometry(.08, .08, 7, 6), M.wood, nb);
  const fg = new THREE.PlaneGeometry(3.2, 2, 16, 4); fg.translate(1.6, -1, 0);
  const flagMat = new THREE.ShaderMaterial({
    side: THREE.DoubleSide, uniforms: { uTime: U.time },
    vertexShader: `uniform float uTime; varying vec3 vCol; varying vec2 vUv;
      void main(){ vUv = uv; vec3 p = position; float ph = instanceMatrix[3].x*.3 + instanceMatrix[3].z*.2;
        p.z += sin(uv.x*6. - uTime*5. + ph)*.35*uv.x; p.y += sin(uv.x*4. - uTime*4. + ph)*.1*uv.x;
        vCol = instanceColor; gl_Position = projectionMatrix*modelViewMatrix*instanceMatrix*vec4(p,1.); }`,
    fragmentShader: `varying vec3 vCol; varying vec2 vUv;
      void main(){ float trim = clamp(step(vUv.y,.1) + step(.9,vUv.y) + step(.92,vUv.x), 0., 1.);
        vec3 c = mix(vCol, vec3(1.3,.75,.1), trim)*(.35 + .65*vUv.y) + vec3(.25,.06,0.)*(1. - vUv.y);
        gl_FragColor = vec4(c,1.); }`
  });
  const flags = new THREE.InstancedMesh(fg, flagMat, nb);
  const pal = [new Color(.85, .02, .02), new Color(1, .55, .02), new Color(1, .8, .05), new Color(.05, .02, .02)];
  banners.forEach(([x, z, c], i) => {
    const base = z < -88 ? -2 : -22;
    mm.makeTranslation(x, base + 3.5, z); poles.setMatrixAt(i, mm);
    mm.makeTranslation(x, base + 6.9, z); flags.setMatrixAt(i, mm);
    flags.setColorAt(i, pal[c]);
  });
  scene.add(poles, flags);
}

// ---------- particles: GPU-animated fire, smoke and embers ----------
function emitterPoints(list, vs, fs, additive) {
  const total = list.reduce((s, e) => s + e[6], 0);
  const pos = new Float32Array(total * 3), rnd = new Float32Array(total * 4), par = new Float32Array(total * 3);
  let i = 0;
  for (const [x, y, z, spread, height, size, count, speed] of list) for (let k = 0; k < count; k++, i++) {
    pos.set([x, y, z], i * 3);
    rnd.set([Math.random(), Math.random(), Math.random(), speed * rand(.7, 1.3)], i * 4);
    par.set([spread, height, size * rand(.7, 1.3)], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aRnd', new THREE.BufferAttribute(rnd, 4));

  camera.lookAt(look);
}

// ---------- post: HDR bloom, then ACES, saturation push, sharpening, vignette, fringe and grain ----------
const composer = new THREE.EffectComposer(renderer, new THREE.WebGLRenderTarget(innerWidth * PR, innerHeight * PR, { type: THREE.HalfFloatType, samples: 4 }));
composer.setPixelRatio(PR); composer.setSize(innerWidth, innerHeight);
composer.addPass(new THREE.RenderPass(scene, camera));
composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .85, .55, .95));
const grade = new THREE.ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2() } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime; uniform vec2 uRes; varying vec2 vUv;
    vec3 aces(vec3 x){ return clamp((x*(2.51*x + .03))/(x*(2.43*x + .59) + .14), 0., 1.); }
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec2 cc = vUv - .5, off = cc*dot(cc,cc)*.012, px = 1./uRes;
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      vec3 blur = (texture2D(tDiffuse, vUv + vec2(px.x,0.)).rgb + texture2D(tDiffuse, vUv - vec2(px.x,0.)).rgb
                 + texture2D(tDiffuse, vUv + vec2(0.,px.y)).rgb + texture2D(tDiffuse, vUv - vec2(0.,px.y)).rgb)*.25;
      vec3 col = vec3(texture2D(tDiffuse, vUv + off).r, c.g, texture2D(tDiffuse, vUv - off).b);
      col = max(col + (c - blur)*.5, 0.);
      col = aces(col*1.15);
      float l = dot(col, vec3(.2126,.7152,.0722));
      col = clamp(mix(vec3(l), col, 1.4), 0., 1.);
      col *= mix(1., smoothstep(.9, .25, length(cc*vec2(1.1,1.))), .55);
      col = pow(col, vec3(1./2.2));
      col += (hash(vUv*1000. + fract(uTime)) - .5)*.025;
      gl_FragColor = vec4(col, 1.);
    }`
});
composer.addPass(grade);
const applySize = () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setPixelRatio(PR); renderer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(PR); composer.setSize(innerWidth, innerHeight);
  grade.uniforms.uRes.value.set(innerWidth * PR, innerHeight * PR); setPixel();
};
applySize();
addEventListener('resize', applySize);

// ---------- loop ----------
const clock = new THREE.Clock();
let arrowClock = 0, arrowSide = 0, perfT = 0, perfN = 0;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame() {
  const raw = clock.getDelta(), dt = Math.min(raw, .05), time = clock.elapsedTime;
  U.time.value = time; grade.uniforms.uTime.value = time;

  // drop resolution if this machine can't hold a smooth frame rate
  if (time > 5) { perfT += raw; perfN++; if (perfT > 2.5) { if (perfN / perfT < 38 && PR > 1) { PR = Math.max(1, PR - .25); applySize(); } perfT = perfN = 0; } }

  headT += dt * (reduced ? .16 : .3);
  updateDragon(time);
  headVel.subVectors(ringP[0], prevHead).divideScalar(Math.max(dt, 1e-3)); prevHead.copy(ringP[0]);

  P(headT + .2, pearl.position).add(tv.set(Math.sin(time * 3) * 1.4, Math.cos(time * 2.3) * 1.4, 0));
  pearlLight.position.copy(pearl.position);
  for (let k = 0; k < 4; k++) { const d = randDir(); spark(pearl.position.x + d.x, pearl.position.y + d.y, pearl.position.z + d.z, d.x * 2, d.y * 2 + 1, d.z * 2, rand(.4, .8), rand(.8, 1.6), 2, 1, -1); }
  for (let k = 0; k < 3; k++) { const p = ringP[(Math.random() * NR * .9) | 0]; spark(p.x, p.y, p.z, rand(-1, 1), rand(-1, 1), rand(-1, 1), rand(.6, 1.2), rand(.25, .5), 2, .5, -.5); }

  if (time > nextBreath) { breath = 1.8; nextBreath = time + rand(7, 11); }
  breath = Math.max(0, breath - dt);
  const open = breath > 0 ? Math.min(1, breath * 3, (1.8 - breath) * 4) : 0;
  DU.uBreath.value = open;
  jaw.rotation.x = .06 + open * .6 + Math.sin(time * 1.7) * .03;
  if (open > .3) {
    head.localToWorld(mouth.set(0, -.45, 5.0)); fwd.copy(ringF[0]);
    const n = Math.round(4200 * dt);
    for (let k = 0; k < n; k++) {
      const d = randDir(), sp = rand(30, 46);
      spark(mouth.x, mouth.y, mouth.z, fwd.x * sp + d.x * 6 + headVel.x * .6, fwd.y * sp + d.y * 6 + headVel.y * .6, fwd.z * sp + d.z * 6 + headVel.z * .6, rand(.6, 1.1), rand(1, 1.8), 1, 1.4, -6);
    }
    breathLight.position.copy(mouth).addScaledVector(fwd, 7);
    breathLight.color.setHSL(.5 + .35 * (.5 + .5 * Math.sin(time * 9)), 1, .6);
  }
  breathLight.intensity = open * 7;

  updateTrebs(time);
  arrowClock += dt;
  while (arrowClock > .07) {
    arrowClock -= .07; arrowSide ^= 1;
    if (arrowSide) { const x = rand(-200, 200); launch(new V3(x, -1, -90), new V3(x + rand(-20, 20), -22, rand(-40, -78)), rand(1.3, 1.9), true); }
    else { const x = rand(-170, 170); launch(new V3(x, -20, rand(-45, -75)), new V3(x + rand(-10, 10), rand(-6, 0), -90), rand(1.3, 1.8), true); }
  }
  updateProjectiles(dt);
  updateSparks(dt);

  fireLights.forEach((l, k) => l.intensity = 3 * (.75 + .25 * Math.sin(time * 13 + k * 3) * Math.sin(time * 7.3 + k * 2)) + Math.random() * .3);
  for (const l of flashLights) l.intensity *= Math.exp(-dt * 4);

  mouse.sx += (mouse.x - mouse.sx) * .04; mouse.sy += (mouse.y - mouse.sy) * .04;
  updateCamera(time);

  composer.render();
  requestAnimationFrame(frame);
}
frame();
const loader = document.getElementById('loader');
loader.style.opacity = 0; setTimeout(() => loader.remove(), 900);
}
</script>
